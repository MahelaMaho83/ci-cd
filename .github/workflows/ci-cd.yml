name: Safebase CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run application tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install and test backend
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Install and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test -- --watch=false --browsers=ChromeHeadless

  build-and-push:
    name: Build ${{ matrix.component }} image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - backend
          - frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=ref,event=pr

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  notify:
    name: Notify Google Chat
    needs:
      - test
      - build-and-push
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Send pipeline result
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          TEST_RESULT: ${{ needs.test.result }}
          IMAGE_RESULT: ${{ needs.build-and-push.result }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::Configure the GOOGLE_CHAT_WEBHOOK repository secret."
            exit 1
          fi

          if [ "$TEST_RESULT" = "success" ] && [ "$IMAGE_RESULT" = "success" ]; then
            STATUS="SUCCESS"
          else
            STATUS="FAILURE"
          fi

          MESSAGE="Safebase CI/CD: ${STATUS}. Commit: ${COMMIT_SHA}. Tests: ${TEST_RESULT}. Images: ${IMAGE_RESULT}. Details: ${RUN_URL}"
          jq -n --arg text "$MESSAGE" '{text: $text}' |
            curl --fail-with-body --silent --show-error \
              -H "Content-Type: application/json" \
              --data-binary @- \
              "$WEBHOOK_URL"
